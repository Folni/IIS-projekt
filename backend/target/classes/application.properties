# =============================================
# Baza podataka - PostgreSQL
# =============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/iis_projekt
spring.datasource.username=iis_user
spring.datasource.password=iis_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================
# WooCommerce API konfiguracija
# =============================================
# PREKIDAČ: "public" koristi pravi WooCommerce API, "custom" koristi naš backend
app.api.mode=custom

# WooCommerce pristupni podaci (registriraj se na woocommerce.com developer sandbox)
app.woocommerce.base-url=https://YOUR_STORE.com/wp-json/wc/v3
app.woocommerce.consumer-key=ck_XXXXXXXXXXXXXXXXXXXXXXXX
app.woocommerce.consumer-secret=cs_XXXXXXXXXXXXXXXXXXXXXXXX

# =============================================
# JWT konfiguracija (Korak 5)
# =============================================
app.jwt.secret=IIS2025SuperTajniKljucKojiMoraBitiDugacakBaremTrideset2Znaka!
app.jwt.access-token-expiration=86400000
app.jwt.refresh-token-expiration=604800000

# =============================================
# gRPC Server (Korak 4)
# =============================================
grpc.server.port=9090

# =============================================
# SOAP Web Service (Korak 2)
# =============================================
spring.webservices.path=/ws

# =============================================
# GraphQL (Korak 5)
# =============================================
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql

# =============================================
# XML datoteka za SOAP/XPath
# =============================================
app.xml.output-path=src/main/resources/xml/products.xml

# =============================================
# Logging
# =============================================
logging.level.hr.algebra.iis=DEBUG
logging.level.org.springframework.ws=DEBUG
